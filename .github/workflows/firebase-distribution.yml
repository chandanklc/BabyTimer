name: Firebase App Distribution

on:
  workflow_dispatch: # Manual trigger from GitHub Actions tab whenever you want
    inputs:
      release_notes:
        description: 'Release notes for this build'
        required: true
        default: 'New build of BabyTimer ready for testing!'

jobs:
  distribute:
    name: Build and Distribute to Firebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: ${{ github.event.inputs.release_notes }}
          groups: 'Tester'
